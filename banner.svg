<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="898" height="298" rx="20" fill="url(#bg)" stroke="#1f2937" stroke-width="2"/>

  <!-- Badge -->
  <rect x="40" y="50" width="196" height="28" rx="14" fill="#0f172a" stroke="#1e3a5f"/>
  <circle cx="58" cy="64" r="4" fill="#22c55e"/>
  <text x="72" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#60a5fa">SOFTWARE DEVELOPER</text>

  <!-- Name -->
  <text x="40" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Van Khai</text>

  <!-- Quote -->
  <text x="40" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-style="italic" fill="#8b949e">"Build things that matter."</text>

  <!-- Pill 1 -->
  <rect x="40" y="205" width="150" height="34" rx="9" fill="#0f172a" stroke="#1f2937"/>
  <circle cx="58" cy="222" r="5" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="74" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Your City, VN</text>

  <!-- Pill 2 -->
  <rect x="200" y="205" width="140" height="34" rx="9" fill="#0f172a" stroke="#1f2937"/>
  <circle cx="218" cy="222" r="5" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="234" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">FPT University</text>

  <!-- Pill 3 -->
  <rect x="350" y="205" width="165" height="34" rx="9" fill="#0f172a" stroke="#1f2937"/>
  <circle cx="368" cy="222" r="5" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="384" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Java Web &amp; Embedded</text>

  <!-- Code window -->
  <rect x="540" y="30" width="320" height="240" rx="12" fill="#0b1018" stroke="#1f2937"/>
  <circle cx="562" cy="52" r="5" fill="#ef4444"/>
  <circle cx="578" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="594" cy="52" r="5" fill="#22c55e"/>
  <text x="700" y="56" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#6b7280">profile.json</text>
  <line x1="541" y1="68" x2="859" y2="68" stroke="#1f2937"/>

  <g font-family="Consolas, Courier New, monospace" font-size="13">
    <text x="562" y="96"><tspan fill="#ff7b72">const</tspan> <tspan fill="#d2a8ff">developer</tspan> <tspan fill="#c9d1d9">=</tspan> <tspan fill="#ffa657">{</tspan></text>
    <text x="578" y="118"><tspan fill="#79c0ff">name</tspan><tspan fill="#c9d1d9">:</tspan> <tspan fill="#a5d6ff">"Van Khai"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="578" y="140"><tspan fill="#79c0ff">primaryStack</tspan><tspan fill="#c9d1d9">:</tspan> <tspan fill="#ffa657">[</tspan></text>
    <text x="594" y="162"><tspan fill="#a5d6ff">"Java"</tspan><tspan fill="#c9d1d9">,</tspan> <tspan fill="#a5d6ff">"JSP/Servlet"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="594" y="184"><tspan fill="#a5d6ff">"SQL Server"</tspan><tspan fill="#c9d1d9">,</tspan> <tspan fill="#a5d6ff">"Arduino"</tspan></text>
    <text x="578" y="206"><tspan fill="#ffa657">]</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="578" y="228"><tspan fill="#79c0ff">status</tspan><tspan fill="#c9d1d9">:</tspan> <tspan fill="#7ee787">"Ready to build"</tspan></text>
    <text x="562" y="250"><tspan fill="#ffa657">}</tspan><tspan fill="#c9d1d9">;</tspan></text>
  </g>
