<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a070b"/>
      <stop offset="0.55" stop-color="#6e0f19"/>
      <stop offset="1" stop-color="#a3141f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5B82E"/>
      <stop offset="0.5" stop-color="#FFD65A"/>
      <stop offset="1" stop-color="#F5B82E"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="898" height="298" rx="20" fill="url(#bg)" stroke="#E0303C" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="5" rx="2.5" fill="url(#bar)"/>

  <!-- Badge -->
  <rect x="40" y="50" width="196" height="28" rx="14" fill="#2a070b" stroke="#F5B82E" stroke-opacity="0.6"/>
  <circle cx="58" cy="64" r="4" fill="#5CE1FF"/>
  <text x="72" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFD65A">SOFTWARE DEVELOPER</text>

  <!-- Name -->
  <text x="40" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Van Khai</text>

  <!-- Quote -->
  <text x="40" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-style="italic" fill="#f3c9bf">"Build things that matter."</text>

  <!-- Pill 1 -->
  <rect x="40" y="205" width="150" height="34" rx="9" fill="#2a070b" fill-opacity="0.75" stroke="#E0303C"/>
  <circle cx="58" cy="222" r="5" stroke="#FFD65A" stroke-width="1.8"/>
  <text x="74" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff4ea">Your City, VN</text>

  <!-- Pill 2 -->
  <rect x="200" y="205" width="140" height="34" rx="9" fill="#2a070b" fill-opacity="0.75" stroke="#E0303C"/>
  <circle cx="218" cy="222" r="5" stroke="#FFD65A" stroke-width="1.8"/>
  <text x="234" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff4ea">FPT University</text>

  <!-- Pill 3 -->
  <rect x="350" y="205" width="165" height="34" rx="9" fill="#2a070b" fill-opacity="0.75" stroke="#E0303C"/>
  <circle cx="368" cy="222" r="5" stroke="#FFD65A" stroke-width="1.8"/>
  <text x="384" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff4ea">Java Web &amp; Embedded</text>

  <!-- Code window -->
  <rect x="540" y="30" width="320" height="240" rx="12" fill="#1a0508" fill-opacity="0.92" stroke="#E0303C"/>
  <circle cx="562" cy="52" r="5" fill="#FF4D5A"/>
  <circle cx="578" cy="52" r="5" fill="#FFD65A"/>
  <circle cx="594" cy="52" r="5" fill="#5CE1FF"/>
  <text x="700" y="56" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#d9a79c">profile.json</text>
  <line x1="541" y1="68" x2="859" y2="68" stroke="#7a1a24"/>

  <g font-family="Consolas, Courier New, monospace" font-size="13">
    <text x="562" y="96"><tspan fill="#ff6b6b">const</tspan> <tspan fill="#FFD65A">developer</tspan> <tspan fill="#f3e3da">=</tspan> <tspan fill="#F5B82E">{</tspan></text>
    <text x="578" y="118"><tspan fill="#ff9a8b">name</tspan><tspan fill="#f3e3da">:</tspan> <tspan fill="#ffe0a8">"Van Khai"</tspan><tspan fill="#f3e3da">,</tspan></text>
    <text x="578" y="140"><tspan fill="#ff9a8b">primaryStack</tspan><tspan fill="#f3e3da">:</tspan> <tspan fill="#F5B82E">[</tspan></text>
    <text x="594" y="162"><tspan fill="#ffe0a8">"Java"</tspan><tspan fill="#f3e3da">,</tspan> <tspan fill="#ffe0a8">"JSP/Servlet"</tspan><tspan fill="#f3e3da">,</tspan></text>
    <text x="594" y="184"><tspan fill="#ffe0a8">"SQL Server"</tspan><tspan fill="#f3e3da">,</tspan> <tspan fill="#ffe0a8">"Arduino"</tspan></text>
    <text x="578" y="206"><tspan fill="#F5B82E">]</tspan><tspan fill="#f3e3da">,</tspan></text>
    <text x="578" y="228"><tspan fill="#ff9a8b">status</tspan><tspan fill="#f3e3da">:</tspan> <tspan fill="#5CE1FF">"Ready to build"</tspan></text>
    <text x="562" y="250"><tspan fill="#F5B82E">}</tspan><tspan fill="#f3e3da">;</tspan></text>
  </g>
</svg>
